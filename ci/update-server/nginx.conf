# Serves the update feed, the builds and the landing page for zed.xetk.co.uk
# from a read-only directory laid out by publish-update.sh:
#
#   index.html
#   nightly/latest.json
#   nightly/Zed-xetk-nightly-<run>-aarch64.dmg   (immutable, one per build)
#   nightly/Zed-xetk-nightly-aarch64.dmg         (symlink to the newest build)
#   stable/...                                    (same layout)
server {
    listen 80;
    server_name zed.xetk.co.uk;

    root /srv/updates;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;

    # The feed is what changes; clients must always see the current one.
    location ~ ^/(nightly|stable)/latest\.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Per-build files never change once published.
    location ~ ^/(nightly|stable)/Zed-xetk-(nightly|stable)-[0-9]+-[a-z0-9_]+\.dmg$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The "newest build" alias (for brew and the landing page) moves.
    location ~ \.dmg$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
