# Static file server for zed.xetk.co.uk. It publishes no ports: the reverse
# proxy reaches it by name on the shared `proxy` network, the same way it
# reaches the F-Droid repo.
services:
  zed-updates:
    image: nginx:alpine
    container_name: zed-updates
    restart: unless-stopped
    volumes:
      - /mnt/shared/zed-updates:/srv/updates:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
