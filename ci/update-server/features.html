<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Features - Zed xetk</title>
<style>
  :root { color-scheme: light dark; --muted: #6b7280; --card: rgba(127,127,127,.08); --line: rgba(127,127,127,.25); --accent: #3b82f6; }
  body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 44rem; margin: 3rem auto; padding: 0 1.25rem; }
  h1 { margin: 0 0 .25rem; }
  .lede { color: var(--muted); margin-top: 0; }
  .channel { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem 1.25rem; margin: 1.25rem 0; }
  .channel h3 { margin: 0 0 .25rem; font-size: 1.1rem; }
  .meta { color: var(--muted); font-size: .9rem; word-break: break-all; }
  a.button { display: inline-block; margin-top: .6rem; padding: .45rem .9rem; border-radius: .5rem; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  code, pre { font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--card); border-radius: .35rem; }
  code { padding: .1rem .3rem; }
  pre { padding: .75rem 1rem; overflow-x: auto; }
</style>
</head>
<body>
<p><a href="./">&larr; Downloads</a></p>
<h1>What this build adds</h1>
<div id="features"><p class="meta">Loading...</p></div>

<script>
  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // Text from features.json is untrusted-shaped: build it with textContent,
  // never innerHTML. `code` renders as <code> and **bold** as <b>.
  function inline(parent, text) {
    text.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(part => {
      if (part.startsWith("`") && part.endsWith("`") && part.length > 2) {
        parent.appendChild(element("code", "", part.slice(1, -1)));
      } else if (part.startsWith("**") && part.endsWith("**") && part.length > 4) {
        parent.appendChild(element("b", "", part.slice(2, -2)));
      } else if (part) {
        parent.appendChild(document.createTextNode(part));
      }
    });
    return parent;
  }

  function card(feature) {
    const box = element("div", "channel");
    box.appendChild(element("h3", "", feature.title));
    if (feature.summary) box.appendChild(element("p", "meta", feature.summary));
    const items = feature.details.filter(line => line);
    if (items.length > 1 && items.every(line => line.length < 160)) {
      const list = element("ul");
      items.forEach(line => list.appendChild(inline(element("li"), line)));
      box.appendChild(list);
    } else {
      items.forEach(line => box.appendChild(inline(element("p"), line)));
    }
    if (feature.example) box.appendChild(element("pre", "", feature.example));
    return box;
  }

  fetch("features.json", { cache: "no-store" })
    .then(response => { if (!response.ok) throw new Error(response.status); return response.json(); })
    .then(data => {
      const container = document.getElementById("features");
      container.textContent = "";
      if (data.intro) container.appendChild(inline(element("p", "lede"), data.intro));
      data.sections.forEach(section => {
        const features = data.features.filter(feature => feature.section === section.id);
        if (features.length === 0) return;
        container.appendChild(element("h2", "", section.title));
        features.forEach(feature => container.appendChild(card(feature)));
      });
    })
    .catch(() => {
      document.getElementById("features").textContent = "Could not load the feature list.";
    });
</script>
</body>
</html>
