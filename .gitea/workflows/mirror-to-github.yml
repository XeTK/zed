# Mirrors main to github.com/XeTK/zed. Gitea is the source of truth: nothing is
# pulled back from GitHub, and GitHub's main is overwritten on every push.
#
# Same approach as xetk/homebrew-zed's mirror: a deploy key scoped to that one
# GitHub repo (secret MIRROR_DEPLOY_KEY). Runs on nixos-deploy (this repo's own
# runner registration on the NixOS deploy VM, see xetk/nixos-runners), not
# macos, so it does not queue behind builds on the single Mac runner. The push
# itself is ci-kit's github-mirror action: ssh.github.com:443 (outbound :22 is
# not guaranteed), with GitHub's host keys pinned in ci-kit rather than fetched
# at run time.
# GitHub Actions is turned off on XeTK/zed, so upstream's workflows in
# .github/ do not run there when this pushes.
name: mirror-to-github

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: mirror-to-github
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: nixos-deploy
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Always push Gitea's main (not HEAD), so a manual run from another
      # branch can never publish that branch as GitHub's main. Force: the GitHub
      # copy must always equal Gitea's main, even after history edits.
      - name: Push main to GitHub
        uses: https://gitea.xetk.co.uk/xetk/ci-kit/github-mirror@v1
        with:
          repo: XeTK/zed
          ssh-key: ${{ secrets.MIRROR_DEPLOY_KEY }}
          refspecs: refs/remotes/origin/main:refs/heads/main
          force: "true"
