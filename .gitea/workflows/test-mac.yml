# Minimal macOS build+test CI for this fork's Gitea mirror.
#
# Adapted from the run_tests_mac job in .github/workflows/run_tests.yml,
# dropping the change-detection orchestration, clippy/style jobs, and
# sccache/R2 remote caching (no secrets for that on this instance). Follows
# the ../../mixxx fork's convention of using tag-pinned actions and
# `runs-on: macos` (the registered label for this instance's persistent
# native macOS runner - see ~/Documents/code/gitea-runner-manager/README.md),
# rather than the upstream GitHub workflow's SHA-pinned actions and
# Namespace-specific runner/cache actions, neither of which exist here.
name: test-mac

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: test-mac-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    runs-on: macos
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Use the pinned Rust toolchain via rustup
        # The runner's default cargo is Homebrew's (currently 1.95.0, no rustup),
        # not the version pinned in rust-toolchain.toml, and it can't install the
        # wasm32-wasip2 target the extension tests need. rustup honours
        # rust-toolchain.toml (toolchain + targets) and keeps them in ~/.rustup,
        # so this is only slow the first time.
        run: |
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "${HOME}/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.cargo/bin:${PATH}"
          rustup toolchain install
          rustup show
          cargo --version

      - name: Set up cargo CI config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Clear target dir if it has grown too large
        # This runner is persistent (not ephemeral), so a stale target/ can
        # accumulate across runs indefinitely without this.
        run: ./script/clear-target-dir-if-larger-than 350 200

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Download wasi-sdk
        run: ./script/download-wasi-sdk

      - name: cargo nextest run
        # Services started by launchd get a low open-file limit (256 by default),
        # and the parallel tests hit "Too many open files" when starting a Tokio
        # runtime (collab editorconfig test).
        #
        # --retries 2 covers timing-based tests that fail intermittently under
        # parallel load (e.g. gpui's foreground_work_excludes_setup_before_trace_
        # scope_starts leaked 46ms of setup work into its measured summary in one
        # of the three runs checked). nextest reports retried tests as FLAKY
        # instead of hiding them.
        #
        # SHELL is pinned because terminal tests start $SHELL interactively and
        # wait for it to exit on EOF. test_terminal_eof timed out on this runner
        # after 15s on every run (9568/9569 otherwise pass); the suspected cause
        # is the login shell's startup (zsh's compinit prompts on insecure
        # directories), which is unconfirmed - this is the experiment.
        env:
          SHELL: /bin/bash
        run: |
          current="$(ulimit -n)"
          if [ "$current" != "unlimited" ] && [ "$current" -lt 10240 ]; then
            ulimit -Sn 10240
          fi
          echo "open file limit: $(ulimit -n)"
          cargo nextest run --workspace --no-fail-fast --no-tests=warn --retries 2

      - name: Clean up cargo CI config
        if: always()
        run: rm -rf ./../.cargo
